name: Deploy frontend to Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_NAME: crrankmatrix
  IMAGE_NAME: rankmatrix-frontend
  RESOURCE_GROUP: rankmatrix
  CONTAINER_APP: ca-rankmatrix-frontend
  APP_KIND: frontend
  PUBLIC_BASE_URL: https://www.rankmatrix.in

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deployment failure-path tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      # The Dockerfile runs Node regression tests, lint and a production build.
      # The exact tested image is uploaded, then pushed by the deploy job.
      - name: Build and test deployable image
        run: |
          docker build --tag "rankmatrix-frontend:$GITHUB_SHA" --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.rankmatrix.in \
            --build-arg NEXT_PUBLIC_GA_ID=G-TZT11R6PC6 \
            --build-arg NEXT_PUBLIC_ENABLE_ADSENSE=false .
          docker save "rankmatrix-frontend:$GITHUB_SHA" | gzip > frontend-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tested-frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: tested-frontend-image
      - name: Azure login (passwordless OIDC)
        uses: azure/login@v2
        with:
          client-id: e2d06f9a-1533-4578-b2e2-caf17f6112c8
          tenant-id: 972ccfa1-9fe8-437a-ab60-3885f9be487e
          subscription-id: f6cdd27d-1584-4ef5-b9d4-31d72ed14d10
      - name: Push tested immutable image
        timeout-minutes: 5
        run: |
          gunzip -c frontend-image.tar.gz | docker load
          az acr login --name "$ACR_NAME"
          docker tag "rankmatrix-frontend:$GITHUB_SHA" "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
      - name: Stage, verify, promote and verify production
        id: release
        timeout-minutes: 25
        run: python3 scripts/deploy_azure.py
      - name: Retry and verify rollback after failure or cancellation
        if: ${{ always() && steps.release.outcome != 'success' && hashFiles('.deploy-state.json') != '' }}
        timeout-minutes: 15
        env:
          ROLLBACK_ONLY: 'true'
        run: python3 scripts/deploy_azure.py
